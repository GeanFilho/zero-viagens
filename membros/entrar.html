<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar | Aliança Viva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="container nav">
      <a class="logo" href="index.html">Aliança <span>Viva</span></a>
      <nav class="nav-links">
        <a href="index.html">Início</a>
        <a href="planos.html">Planos</a>
        <a href="biblioteca.html">Biblioteca</a>
        <a href="dashboard.html">Área de membros</a>
        <a class="btn btn-primary" href="entrar.html">Entrar</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="auth-card">
        <div class="breadcrumbs">
          <a class="back-link" href="index.html">Home</a>
          <span>›</span>
          <span>Entrar</span>
        </div>
        <h1>Acesso de demonstração</h1>
        <p class="muted">Simule o fluxo de login para explorar o ambiente de membros.</p>
        <form>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="voce@email.com" />
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="••••••" />
          </div>
          <div class="notice">Este é um protótipo navegável. Nenhuma informação é enviada.</div>
          <div class="banner-actions">
            <a class="btn btn-primary" href="dashboard.html">Entrar e ver área de membros</a>
            <a class="btn btn-ghost" href="planos.html">Ver planos</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
